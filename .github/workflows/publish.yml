name: publish

# Publishing is a person's decision: a merge to main publishes nothing. Run
# this from the Actions tab (Publish, Run workflow) on main.
#
#   stable  the next patch (0.0.5 -> 0.0.6). One commit on main sets the version
#           in every manifest, points the catalogue at the new tag, and names
#           the CHANGELOG's Unreleased section; that commit is tagged and
#           becomes the Latest GitHub Release, which every agent installs from.
#   beta    that patch's next -beta.N, as a pre-release. Its commit is tagged
#           but not pushed to main, and GitHub never marks it Latest, so only
#           someone who names the tag gets it.
#
# Only a repository admin can publish. The run pushes with the release
# environment's deploy key, the one key the main and v* tag rulesets let
# through, and that environment gives its secret only to runs on main.
#
# force_update makes this version the minimum: older copies stop calling the
# tenant until they update (release.json, scripts/lib/update-check.mjs).

on:
  workflow_dispatch:
    inputs:
      channel:
        description: stable or beta
        type: choice
        options: [stable, beta]
        default: stable
      force_update:
        description: Require every copy to update to this version (stable only)
        type: boolean
        default: false
      message:
        description: One line people see with the update notice (optional)
        type: string
        required: false

permissions:
  contents: write

concurrency:
  group: publish
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    environment: release
    steps:
      - name: only from main
        if: github.ref != 'refs/heads/main'
        run: |
          echo "::error::Run publish on main, not ${GITHUB_REF}."
          exit 1

      - name: only an admin
        env:
          GH_TOKEN: ${{ github.token }}
          ACTOR: ${{ github.triggering_actor }}
        run: |
          permission=$(gh api "repos/$GITHUB_REPOSITORY/collaborators/$ACTOR/permission" --jq .permission)
          if [ "$permission" != admin ]; then
            echo "::error::Only a repository admin can publish; $ACTOR has $permission."
            exit 1
          fi

      - uses: actions/checkout@v5
        with:
          ref: main
          fetch-depth: 0
          ssh-key: ${{ secrets.RELEASE_DEPLOY_KEY }}

      - uses: actions/setup-node@v5
        with:
          node-version: 22

      # A normal release keeps the minimum the last one set, so it never lifts a
      # forced update. No release yet means no minimum.
      - name: previous minimum
        id: previous
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          min=0.0.0
          if gh release download --repo "$GITHUB_REPOSITORY" --pattern release.json --dir "$RUNNER_TEMP/previous" 2>/dev/null; then
            min=$(node -e "console.log(JSON.parse(require('fs').readFileSync(process.argv[1],'utf8')).minRequiredVersion || '0.0.0')" "$RUNNER_TEMP/previous/release.json")
          fi
          echo "min=$min" >> "$GITHUB_OUTPUT"

      - name: prepare
        id: prepare
        env:
          CHANNEL: ${{ inputs.channel }}
          FORCE: ${{ inputs.force_update }}
          MESSAGE: ${{ inputs.message }}
          PREVIOUS_MIN: ${{ steps.previous.outputs.min }}
        run: |
          args=(prepare --channel "$CHANNEL" --previous-min "$PREVIOUS_MIN")
          [ "$FORCE" = "true" ] && args+=(--force)
          [ -n "$MESSAGE" ] && args+=(--message "$MESSAGE")
          out=$(node scripts/release/publish.mjs "${args[@]}")
          echo "$out"
          echo "tag=$(node -e "console.log(JSON.parse(process.argv[1]).tag)" "$out")" >> "$GITHUB_OUTPUT"
          echo "prerelease=$(node -e "console.log(JSON.parse(process.argv[1]).prerelease)" "$out")" >> "$GITHUB_OUTPUT"

      - name: test the release
        run: npm test

      - name: validate the plugin
        run: |
          npm install -g @anthropic-ai/claude-code
          claude plugin validate .

      - name: commit and tag
        env:
          TAG: ${{ steps.prepare.outputs.tag }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "release: $TAG"
          git tag -a "$TAG" -m "$TAG"

      # The tag and its Release exist before main names the tag, so nobody who
      # reads the catalogue in between is sent to a tag that is not there yet.
      - name: push the tag
        env:
          TAG: ${{ steps.prepare.outputs.tag }}
        run: git push origin "refs/tags/$TAG"

      - name: create the GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.prepare.outputs.tag }}
          PRERELEASE: ${{ steps.prepare.outputs.prerelease }}
        run: |
          flags=(--latest)
          [ "$PRERELEASE" = "true" ] && flags=(--prerelease --latest=false)
          gh release create "$TAG" --repo "$GITHUB_REPOSITORY" --title "$TAG" --notes-file dist/notes.md "${flags[@]}" dist/release.json install.sh

      - name: move main to the release
        if: steps.prepare.outputs.prerelease != 'true'
        run: git push origin HEAD:main
